name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          missing=0
          for f in index.html config.xml plugin.xml smspayment.js SmsPaymentPlugin.java SmsReceiver.java smspay_paths.xml icon.png; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo root: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 platforms;android-34 build-tools;33.0.2 build-tools;34.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add repo secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          KEYSTORE_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "Secret lengths: base64=${#KEYSTORE_BASE64} (expected 3588), password=${#KEYSTORE_PASSWORD} (expected 22)"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore" || true
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kt.log" 2>&1 \
            || { cat "$RUNNER_TEMP/kt.log"; echo "::error::Keystore or password is wrong - check the lengths printed above and re-paste the secrets"; exit 1; }
          K="$RUNNER_TEMP/release.keystore"
          P="$KEYSTORE_PASSWORD"
          printf '{"android":{"release":{"keystore":"%s","storePassword":"%s","alias":"rentalkhata","password":"%s","keystoreType":"pkcs12"},"debug":{"keystore":"%s","storePassword":"%s","alias":"rentalkhata","password":"%s","keystoreType":"pkcs12"}}}' \
            "$K" "$P" "$P" "$K" "$P" "$P" > "$RUNNER_TEMP/build.json"

      - name: Assemble project from repo files
        run: |
          mkdir -p plugin/www plugin/res/xml plugin/src/android
          cp plugin.xml plugin/plugin.xml
          echo '{"name":"cordova-plugin-smspayment","version":"1.0.0","cordova":{"id":"cordova-plugin-smspayment","platforms":["android"]}}' > plugin/package.json
          cp smspayment.js plugin/www/
          cp smspay_paths.xml plugin/res/xml/
          cp SmsPaymentPlugin.java SmsReceiver.java plugin/src/android/

          cordova create app com.ankit.khata "Rental Khata"
          cp config.xml app/config.xml
          cp index.html app/www/index.html

          # App icon
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          mkdir -p app/res
          ICONS=""
          for p in ldpi:36 mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon.png -resize ${s}x${s} app/res/icon-$d.png
            ICONS="$ICONS<icon src=\"res/icon-$d.png\" density=\"$d\" />"
          done
          sed -i "s#</widget>#$ICONS</widget>#" app/config.xml

          # Version stamp + repo name (used by the in-app updater)
          N=${{ github.run_number }}
          REPO=${{ github.repository }}
          sed -i "s#<widget id=\"com.ankit.khata\" version=\"1.0.0\"#<widget id=\"com.ankit.khata\" android-versionCode=\"$N\" version=\"1.0.$N\"#" app/config.xml
          sed -i "s#window.APP_BUILD = 0; window.APP_REPO = \"\";#window.APP_BUILD = $N; window.APP_REPO = \"$REPO\";#" app/www/index.html
          grep -q "android-versionCode=\"$N\"" app/config.xml || { echo "::error::version stamp failed in config.xml"; exit 1; }
          grep -q "window.APP_BUILD = $N;" app/www/index.html || { echo "::error::APP_BUILD stamp failed - use the index.html from the package"; exit 1; }

          cd app
          cordova platform add android@12.0.1
          cordova plugin add ../plugin

      - name: Build signed APK
        run: |
          cd app
          cordova build android --release --buildConfig="$RUNNER_TEMP/build.json" \
            || { echo "Release build failed - retrying as signed debug build"; cordova build android --debug --buildConfig="$RUNNER_TEMP/build.json"; }

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(ls app/platforms/android/app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned | head -1)
          [ -n "$APK" ] || APK=$(ls app/platforms/android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "Using $APK"
          cp "$APK" out/RentalKhata.apk
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs out/RentalKhata.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: RentalKhata-apk
          path: out/RentalKhata.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/RentalKhata.apk
