function openExternal(url) {
  if (window.cordova) window.location.href = url;
  else window.open(url, "_blank");
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Returns true when the native Android share sheet took over.
async function nativeShareFile(blob, filename, title) {
  if (!(window.SmsPayment && window.SmsPayment.shareFile)) return false;
  try {
    const b64 = await blobToBase64(blob);
    await new Promise((ok, fail) =>
      window.SmsPayment.shareFile(b64, filename, blob.type || "application/octet-stream", title || filename, ok, fail),
    );
  } catch (err) {
    showToast("Share नहीं हो पाया");
  }
  return true;
}

      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(37,52,79,.2);padding-top:8px"><span style="color:#8b7355">मिली राशि</span><b style="font-size:28px;color:#2f6b4f">₹${Number(paymentAmount).toLocaleString("en-IN")}</b></div>
    </div>
    <div style="font-size:12px;color:#8b7355;margin-bottom:6px">भुगतान कैसे मिला?</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">${methodButtonsHtml([["नकद (Cash)", "💵 नकद"], ["UPI", "📱 UPI"], ["बैंक ट्रांसफर (Bank)", "🏦 Bank"]])}</div>
    <div style="display:flex;gap:10px">
      <button id="pv-cancel" style="${BTN_SECONDARY}">रद्द करें</button>
      <button id="pv-ok" style="${BTN_PRIMARY}">✓ सेव करें</button>
    </div>`);
  const getMethod = khataMethodPicker(el, "नकद (Cash)");
  el.querySelector("#pv-cancel").onclick = () => el.remove();
  el.querySelector("#pv-ok").onclick = () => {
    const m = getMethod();
    el.remove();
    onVerify(m);
  };
}

// ---------- SMS payment detection ----------
const SMS_INBOX_KEY = "khata_sms_inbox";
const SMS_SEEN_KEY = "khata_sms_seen_refs";
let smsDialogOpen = false;
let smsPermWarned = false;

function smsLoad(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || "[]");
  } catch (e) {
    return [];
  }
}
function smsSave(key, arr) {
  try {
    localStorage.setItem(key, JSON.stringify(arr.slice(-60)));
  } catch (e) {}
}

// Accepts only bank/UPI credit messages; rejects OTPs, debits and collect-requests.
function parseBankSms(body) {
  const t = String(body || "");
  const low = t.toLowerCase();
  if (/\botp\b|one time password|debited|withdrawn|\bdr\b|request/.test(low)) return null;
  if (!/(credited|received|deposited|\bcr\b|credit)/.test(low)) return null;
  const m = t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);
  if (!m) return null;
  const amount = Math.round(parseFloat(m[1].replace(/,/g, "")) * 100) / 100;
  if (!(amount > 0) || amount >= 1e7) return null;
  const ref = (t.match(/\b\d{12}\b/) || [""])[0];
  return { amount, ref };
}

function collectPendingSms() {
  if (!window.SmsPayment) return;
  window.SmsPayment.getPending(
    (list) => {
      const inbox = smsLoad(SMS_INBOX_KEY);
      const seen = smsLoad(SMS_SEEN_KEY);
      (list || []).forEach((m) => {
        if (inbox.some((x) => x.id === m.id)) return;
        const p = parseBankSms(m.body);
        if (!p) return;
        if (p.ref && (seen.includes(p.ref) || inbox.some((x) => x.ref === p.ref))) return;
        inbox.push({ id: m.id, ts: m.ts, body: m.body, amount: p.amount, ref: p.ref });
      });
      smsSave(SMS_INBOX_KEY, inbox);
      showNextDetectedPayment();
    },
    () => {},
  );
}

// Applies money to the customer's oldest unpaid entries first; leftover becomes advance.
function applyDetectedPayment(customerId, amount, method, ref) {
  const txns = loadTxns(customerId);
  if (!txns.length) {
    showToast("इस ग्राहक की कोई एंट्री नहीं है");
    return false;
  }
  const stamp = nowISO();
  const mk = (amt) => ({ amount: amt, date: stamp, verified: true, auto: true, method, ...(ref ? { ref } : {}) });
  const r2 = (x) => Math.round(x * 100) / 100;
  let left = amount;
  txns
    .map((t) => ({ t, m: txnMath(t) }))
    .filter((x) => x.m.due > 0)
    .sort((a, b) => new Date(a.t.dateGiven) - new Date(b.t.dateGiven))
    .forEach(({ t, m }) => {
      if (left <= 0) return;
      const part = r2(Math.min(left, m.due));
      t.payments = [...(t.payments || []), mk(part)];
      t.history = [...(t.history || []), { ts: stamp, note: `✓ SMS payment ₹${part.toLocaleString("en-IN")} (${method}) locked` }];
      left = r2(left - part);
    });
  if (left > 0) {
    const t = txns[txns.length - 1];
    t.payments = [...(t.payments || []), mk(left)];
    t.history = [...(t.history || []), { ts: stamp, note: `✓ SMS payment ₹${left.toLocaleString("en-IN")} (${method}) locked (advance)` }];
  }
  saveTxns(customerId, txns);
  if (String(state.activeCustomerId) === String(customerId)) state.txns = txns;
  return true;
}

function showNextDetectedPayment() {
  if (smsDialogOpen) return;
  const inbox = smsLoad(SMS_INBOX_KEY);
  if (!inbox.length) return;
  const customers = loadCustomers();
  if (!customers.length) return;
  const item = inbox[0];
  const rows = customers
    .map((c) => ({ c, due: txnMath_all(loadTxns(c.id)).due }))
    .sort((a, b) => b.due - a.due);
  const opts = rows
    .map(
      ({ c, due }) =>
        `<option value="${esc(c.id)}">${esc(c.name)}${due > 0 ? " — बकाया ₹" + Math.round(due).toLocaleString("en-IN") : ""}</option>`,
    )
    .join("");
  smsDialogOpen = true;
  const el = khataSheet(`
    <h2 style="font-size:20px;font-weight:700;color:#2f6b4f;margin:0 0 2px">💰 नया भुगतान मिला</h2>
    <p style="font-size:12px;color:#8b7355;margin:0 0 12px">SMS से पता चला · कुल ${inbox.length} बाकी</p>
    <div style="border:2px solid #2f6b4f;background:rgba(47,107,79,.1);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:32px;font-weight:700;color:#2f6b4f">₹${item.amount.toLocaleString("en-IN")}</div>
      ${item.ref ? `<div style="font-size:12px;margin-top:2px">Ref: ${esc(item.ref)}</div>` : ""}
      <div style="font-size:11px;color:#8b7355;margin-top:8px;word-break:break-word">${esc(String(item.body).slice(0, 240))}</div>
    </div>
    <div style="font-size:12px;color:#8b7355;margin-bottom:4px">किस ग्राहक का भुगतान है?</div>
    <select id="sms-cust" style="width:100%;padding:12px;border:1px solid rgba(37,52,79,.3);border-radius:10px;background:#fff;font-size:15px;margin-bottom:12px">${opts}</select>
    <div style="display:flex;gap:8px;margin-bottom:16px">${methodButtonsHtml([["UPI", "📱 UPI"], ["बैंक ट्रांसफर (Bank)", "🏦 Bank"]])}</div>
    <div style="display:flex;gap:8px">
      <button id="sms-discard" style="${BTN_SECONDARY};color:#b23a3a">हटाएं</button>
      <button id="sms-later" style="${BTN_SECONDARY}">बाद में</button>
      <button id="sms-save" style="${BTN_PRIMARY}">✓ सेव</button>
    </div>`);
  const sel = el.querySelector("#sms-cust");
  if (rows.some((r) => String(r.c.id) === String(state.activeCustomerId))) sel.value = state.activeCustomerId;
  const getMethod = khataMethodPicker(el, "UPI");
  const close = () => {
    el.remove();
    smsDialogOpen = false;
  };
  const dropItem = () => smsSave(SMS_INBOX_KEY, smsLoad(SMS_INBOX_KEY).filter((x) => x.id !== item.id));
  el.querySelector("#sms-later").onclick = close;
  el.querySelector("#sms-discard").onclick = () => {
    dropItem();
    close();
    showNextDetectedPayment();
  };
  el.querySelector("#sms-save").onclick = () => {
    if (!applyDetectedPayment(sel.value, item.amount, getMethod(), item.ref)) return;
    dropItem();
    if (item.ref) smsSave(SMS_SEEN_KEY, [...smsLoad(SMS_SEEN_KEY), item.ref]);
    const who = rows.find((r) => String(r.c.id) === String(sel.value));
    showToast(`✓ ₹${item.amount.toLocaleString("en-IN")} सेव हुआ${who ? " — " + who.c.name : ""}`);
    close();
    render();
    showNextDetectedPayment();
  };
}

document.addEventListener("deviceready", () => {
  if (!window.SmsPayment) return;
  window.SmsPayment.requestPermission(() => {}, () => {});
  window.SmsPayment.listen(() => collectPendingSms(), () => {});
  collectPendingSms();
  document.addEventListener("resume", () => {
    if (!smsPermWarned)
      window.SmsPayment.hasPermission(
        (s) => {
          if (s !== "granted") {
            smsPermWarned = true;
            showToast("SMS permission बंद है — Settings में allow करें");
          }
        },
        () => {},
      );
    collectPendingSms();
  });
});

</script>

<script>
/* In-app update check: compares this build with the latest GitHub release */
(function () {
  var REPO = String(window.APP_REPO || "");
  function buildFromTag(tag) {
    var m = /(\d+)\s*$/.exec(String(tag || ""));
    return m ? parseInt(m[1], 10) : 0;
  }
  function showUpdateBanner(build, url) {
    if (document.getElementById("app-update-banner")) return;
    var b = document.createElement("div");
    b.id = "app-update-banner";
    b.style.cssText =
      "position:fixed;left:10px;right:10px;bottom:14px;z-index:99999;background:#25344f;color:#f3ecd9;" +
      "border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:14px/1.35 system-ui,sans-serif;" +
      "display:flex;align-items:center;gap:10px";
    b.innerHTML =
      '<div style="flex:1"><b>नया अपडेट उपलब्ध (Build ' + build + ')</b>' +
      '<div style="font-size:12px;opacity:.8;margin-top:2px">पहले Backup ले लें, फिर Update दबाएँ</div></div>' +
      '<button id="upd-later" style="background:transparent;color:#f3ecd9;border:1px solid #f3ecd955;border-radius:10px;padding:8px 10px;font-size:13px">बाद में</button>' +
      '<button id="upd-go" style="background:#c2703d;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px">Update</button>';
    document.body.appendChild(b);
    document.getElementById("upd-later").onclick = function () {
      try { localStorage.setItem("rk_skip_build", String(build)); } catch (e) {}
      b.remove();
    };
    document.getElementById("upd-go").onclick = function () {
      b.remove();
      window.location.href = url; /* opens browser download; then tap the APK to install */
    };
  }
  function checkForUpdate() {
    var cur = Number(window.APP_BUILD) || 0;
    if (!cur || !REPO || !window.cordova) return; /* only inside the installed app */
    var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 8000) : null;
    fetch("https://api.github.com/repos/" + REPO + "/releases/latest", ctl ? { signal: ctl.signal } : {})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (timer) clearTimeout(timer);
        if (!d) return;
        var latest = buildFromTag(d.tag_name);
        var asset = (d.assets || []).filter(function (a) { return /\.apk$/i.test(a.name); })[0];
        if (!asset || latest <= cur) return;
        var skipped = 0;
        try { skipped = Number(localStorage.getItem("rk_skip_build")) || 0; } catch (e) {}
        if (skipped === latest) return;
        showUpdateBanner(latest, asset.browser_download_url);
      })
      .catch(function () {});
  }
  document.addEventListener("deviceready", function () {
    setTimeout(checkForUpdate, 2500);
  });
})();
</script>
